<!doctype html>
<html data-theme="light" data-color-scheme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="AionUi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AionUi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4E5969" />
    <link rel="icon" type="image/png" href="./pwa/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa/icon-180.png" />
    <title>AionUi</title>
    <script>
      // Test-only first-frame observer. The main process supplies selectors in the renderer URL;
      // this runs before React and keeps DOM access inside the renderer process.
      (function () {
        var serializedSelectors = new URLSearchParams(window.location.search).get('aionui-e2e-forbidden-selectors');
        if (!serializedSelectors) return;

        var selectors = JSON.parse(serializedSelectors);
        if (
          !Array.isArray(selectors) ||
          !selectors.every(function (selector) {
            return typeof selector === 'string';
          })
        ) {
          throw new Error('aionui-e2e-forbidden-selectors must contain a JSON string array');
        }

        var violations = [];
        var inspect = function (root) {
          selectors.forEach(function (selector) {
            var matches = [];
            if (root instanceof Element && root.matches(selector)) matches.push(root);
            root.querySelectorAll(selector).forEach(function (match) {
              matches.push(match);
            });
            matches.forEach(function (match) {
              violations.push({ selector: selector, html: match.outerHTML.slice(0, 500) });
            });
          });
        };

        window.__getE2EUiObserverState = function () {
          return { selectors: selectors.slice(), violations: violations.slice() };
        };
        inspect(document);
        new MutationObserver(function (records) {
          records.forEach(function (record) {
            record.addedNodes.forEach(function (node) {
              if (node instanceof Element) inspect(node);
            });
          });
        }).observe(document, { childList: true, subtree: true });
      })();
    </script>
    <script>
      // Restore appearance and explicit product presentation before the first business frame.
      (function () {
        try {
          var theme = localStorage.getItem('__aionui_theme');
          if (theme) document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
        try {
          window.__kiBuddyProductPresentation = null;
          window.__kiBuddyProductBootstrapError = null;
          var bootstrap =
            typeof window.__getKiBuddyProductBootstrap === 'function'
              ? window.__getKiBuddyProductBootstrap()
              : { status: 'absent', productIdentity: null, capability: null, error: null };
          if (!bootstrap || !['absent', 'invalid', 'ready'].includes(bootstrap.status)) {
            throw new Error('Invalid Ki-Buddy product bootstrap snapshot');
          }
          if (bootstrap.status === 'invalid') throw new Error(bootstrap.error);
          var candidate = bootstrap.status === 'ready' ? bootstrap.capability : null;
          var product =
            candidate &&
            candidate.id === 'ki-buddy' &&
            candidate.schemaVersion === 4 &&
            Array.isArray(candidate.integrations) &&
            candidate.integrations.every(function (integration) {
              return integration === 'agentsGateway';
            }) &&
            candidate.brand &&
            typeof candidate.brand.productName === 'string' &&
            candidate.assets &&
            typeof candidate.assets.logo === 'string' &&
            candidate.assets.logo.length > 0 &&
            typeof candidate.assets.mascot === 'string' &&
            candidate.assets.mascot.length > 0 &&
            candidate.locale &&
            typeof candidate.locale.namespace === 'string' &&
            candidate.themes &&
            typeof candidate.themes.light === 'string' &&
            candidate.themes.light.length > 0 &&
            typeof candidate.themes.dark === 'string' &&
            candidate.themes.dark.length > 0 &&
            candidate.experience &&
            candidate.experience.schemaVersion === 1 &&
            candidate.experience.features &&
            candidate.experience.resources &&
            candidate.experience.behaviorDefaults
              ? candidate
              : null;
          if (candidate && !product) throw new Error('Invalid Ki-Buddy product presentation capability');
          window.__kiBuddyProductPresentation = product;
          if (!product) return;
          var root = document.documentElement;
          root.setAttribute('data-product', product.id);
          var appearance = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
          var productTheme = product.themes && product.themes[appearance];
          if (productTheme) root.setAttribute('data-product-theme', productTheme);
          document.title = product.brand.productName;
          var applicationName = document.querySelector('meta[name="application-name"]');
          var mobileTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (applicationName) applicationName.setAttribute('content', product.brand.productName);
          if (mobileTitle) mobileTitle.setAttribute('content', product.brand.productName);
        } catch (e) {
          window.__kiBuddyProductBootstrapError = e instanceof Error ? e.message : String(e);
          console.error('[Ki-Buddy product bootstrap] Failed to apply product presentation', e);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      // Set arco-theme on body synchronously
      try {
        var t = localStorage.getItem('__aionui_theme');
        if (t) document.body.setAttribute('arco-theme', t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
