name: Ki-Buddy Stable Release

on:
  push:
    tags:
      - 'ki-buddy-v*'

permissions:
  contents: read

concurrency:
  group: ki-buddy-stable-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  validate-release:
    name: Validate Ki-Buddy release
    if: vars.KI_ENABLE_RELEASE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch mapped AionUi tag
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY=$(node packages/shared-scripts/src/kiBuddyRelease.js verify --skip-git true \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA")
          AIONUI_REPOSITORY=$(jq -r '.aionUi.repository' <<< "$IDENTITY")
          AIONUI_TAG=$(jq -r '.aionUi.tag' <<< "$IDENTITY")
          git fetch --force --no-tags \
            "https://github.com/${AIONUI_REPOSITORY}.git" \
            "refs/tags/${AIONUI_TAG}:refs/tags/${AIONUI_TAG}"

      - name: Validate tag, mapping and upstream package
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < ki-buddy-version.txt)
          EXPECTED_TAG="ki-buddy-v${VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match product version $VERSION."
            exit 1
          fi
          node packages/shared-scripts/src/kiBuddyRelease.js verify \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require release commit on product/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin product/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/product/main; then
            echo "::error::Release tag must point to a commit contained in product/main."
            exit 1
          fi

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for $GITHUB_REF_NAME."
            exit 1
          fi

  code-quality:
    name: Code Quality
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Run TypeScript type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

  build-pipeline:
    name: Build six desktop targets
    needs: [validate-release, code-quality]
    uses: ./.github/workflows/_build-reusable.yml
    with:
      skip_code_quality: true
      enable_sentry: ${{ vars.KI_ENABLE_SENTRY == 'true' }}
      upload_source_maps: ${{ vars.KI_ENABLE_SENTRY == 'true' }}
      ki_core_source_policy: release-pinned
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"},
          {"platform":"macos-x64","os":"macos-14","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"},
          {"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"},
          {"platform":"windows-arm64","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"},
          {"platform":"linux-x64","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"},
          {"platform":"linux-arm64","os":"ubuntu-24.04-arm","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}
        ]}
    secrets: inherit

  pack-web-cli:
    name: Pack Web CLI
    needs: [validate-release, code-quality]
    uses: ./.github/workflows/pack-web-cli.yml
    with:
      ref: ''
      append_commit_hash: false
      skip_code_quality: true
    secrets: inherit

  create-draft-release:
    name: Create Ki-Buddy Draft Release
    needs: [validate-release, build-pipeline, pack-web-cli]
    runs-on: ubuntu-latest
    environment: ki-buddy-stable
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: build-artifacts

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-release-assets.sh build-artifacts release-assets
          bash scripts/verify-release-assets.sh release-assets "${{ needs.validate-release.outputs.version }}"

      - name: Generate Ki-Buddy release notes
        run: |
          node packages/shared-scripts/src/kiBuddyRelease.js notes \
            --version "${{ needs.validate-release.outputs.version }}" \
            --output release-notes.md

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ki-Buddy v${{ needs.validate-release.outputs.version }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: release-assets/*
