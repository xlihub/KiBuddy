name: Build project package

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Project package mode
        required: true
        default: preview
        type: choice
        options:
          - preview
          - formal
      distribution_id:
        description: Registered project distribution id
        required: true
        type: string
      source_sha:
        description: Full KiBuddy source commit SHA
        required: true
        type: string
      version:
        description: 'Formal only: exact project SemVer from distribution-manifest.json'
        required: false
        type: string
      ki_core_source_policy:
        description: 'Formal only: immutable Ki-Core Release pin or verified candidate artifact'
        required: true
        default: release-pinned
        type: choice
        options:
          - release-pinned
          - candidate
      ki_core_candidate_run_id:
        description: 'Formal candidate only: successful Ki-Core Candidate Build run ID'
        required: false
        type: string
      ki_core_candidate_head_sha:
        description: 'Formal candidate only: full Ki-Core product/main commit SHA'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: project-${{ inputs.mode }}-${{ inputs.distribution_id }}-${{ inputs.mode == 'formal' && inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.mode == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      registration_revision: ${{ steps.resolve.outputs.registration_revision }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    env:
      BUILD_PLAN: ${{ github.workspace }}/validated/project-build-plan.json
    steps:
      - name: Checkout trusted product registration
        uses: actions/checkout@v6
        with:
          ref: product/main
          path: trusted
          persist-credentials: false

      - name: Checkout requested project source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve trusted preview build plan
        id: resolve
        shell: bash
        env:
          DISTRIBUTION_ID: ${{ inputs.distribution_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$DISTRIBUTION_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p "require('./source/distribution-manifest.json').distributionId")" = "$DISTRIBUTION_ID"
          platforms_json="$(node -p "JSON.stringify(require('./source/distribution-manifest.json').platforms.preview)")"
          registration_revision="$(git -C trusted rev-parse HEAD)"
          node trusted/packages/shared-scripts/src/projectDistribution.js resolve \
            --registry trusted/distributions/registry.json \
            --manifest source/distribution-manifest.json \
            --product-config trusted/ki-buddy-product.json \
            --platforms-json "$platforms_json" \
            --source-sha "$SOURCE_SHA" \
            --registration-revision "$registration_revision" \
            --output "$BUILD_PLAN"
          baseline="$(node -p "require('./validated/project-build-plan.json').baseline.commit")"
          git -C source merge-base --is-ancestor "$baseline" "$SOURCE_SHA"
          node trusted/packages/shared-scripts/src/projectDistribution.js create-build-matrix \
            --build-plan "$BUILD_PLAN" \
            --output validated/matrix.json
          matrix="$(tr -d '\n' < validated/matrix.json)"
          printf 'registration_revision=%s\n' "$registration_revision" >> "$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload immutable validation plan
        uses: actions/upload-artifact@v6
        with:
          name: project-plan-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: validated/project-build-plan.json

  build:
    if: inputs.mode == 'preview'
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      KI_BUDDY_RESOLVED_BUILD_PLAN: ${{ github.workspace }}/validated/project-build-plan.json
      AIONUI_BACKEND_SOURCE_POLICY: release-pinned
    steps:
      - name: Checkout trusted project build setup
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.registration_revision }}
          path: trusted
          persist-credentials: false

      - name: Checkout requested project source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Download immutable validation plan
        uses: actions/download-artifact@v7
        with:
          name: project-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: validated

      - name: Prepare project build dependencies
        uses: ./trusted/.github/actions/setup-project-build
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          source-directory: ${{ github.workspace }}/source

      - name: Build preview package
        working-directory: source
        run: ${{ matrix.command }}

      - name: Upload unverified preview installer
        uses: actions/upload-artifact@v6
        with:
          name: project-candidate-installer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
          path: |
            source/out/*.dmg
            source/out/*.exe
            source/out/*.deb

      - name: Upload unverified preview evidence
        uses: actions/upload-artifact@v6
        with:
          name: project-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
          path: source/out/project-distribution/project-build-evidence.json

  verify:
    if: inputs.mode == 'preview'
    needs: [validate, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      VALIDATED_PLAN: ${{ github.workspace }}/validated/project-build-plan.json
      EXPECTED_PLAN: ${{ github.workspace }}/expected/project-build-plan.json
    steps:
      - name: Checkout exact trusted registration revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.registration_revision }}
          path: trusted
          persist-credentials: false

      - name: Checkout requested project source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download immutable validation plan
        uses: actions/download-artifact@v7
        with:
          name: project-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: validated

      - name: Download unverified preview installer
        uses: actions/download-artifact@v7
        with:
          name: project-candidate-installer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: candidate

      - name: Download unverified preview evidence
        uses: actions/download-artifact@v7
        with:
          name: project-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: candidate

      - name: Re-resolve expected plan from trusted sources
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          REGISTRATION_REVISION: ${{ needs.validate.outputs.registration_revision }}
        run: |
          set -euo pipefail
          platforms_json="$(node -p "JSON.stringify(require('./source/distribution-manifest.json').platforms.preview)")"
          node trusted/packages/shared-scripts/src/projectDistribution.js resolve \
            --registry trusted/distributions/registry.json \
            --manifest source/distribution-manifest.json \
            --product-config trusted/ki-buddy-product.json \
            --platforms-json "$platforms_json" \
            --source-sha "$SOURCE_SHA" \
            --registration-revision "$REGISTRATION_REVISION" \
            --output "$EXPECTED_PLAN"
          cmp "$VALIDATED_PLAN" "$EXPECTED_PLAN"

      - name: Verify preview platform artifact
        run: >-
          node trusted/packages/shared-scripts/src/projectDistribution.js verify-artifact
          --project-root source
          --artifacts-root candidate
          --platform ${{ matrix.platform }}
          --build-plan expected/project-build-plan.json
          --output-directory verified/${{ matrix.platform }}

      - name: Upload verified preview package and immutable evidence
        uses: actions/upload-artifact@v6
        with:
          name: ki-buddy-${{ inputs.distribution_id }}-${{ inputs.source_sha }}-${{ matrix.platform }}-preview
          if-no-files-found: error
          retention-days: 7
          path: |
            verified/${{ matrix.platform }}/installers/
            expected/project-build-plan.json
            verified/${{ matrix.platform }}/project-build-evidence.json

  formal_validate:
    if: inputs.mode == 'formal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      registration_revision: ${{ steps.resolve.outputs.registration_revision }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    env:
      BUILD_PLAN: ${{ github.workspace }}/validated/project-build-plan.json
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted product policy
        uses: actions/checkout@v6
        with:
          ref: product/main
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout requested project source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve protected formal build plan
        id: resolve
        shell: bash
        env:
          DISTRIBUTION_ID: ${{ inputs.distribution_id }}
          PROJECT_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          KI_CORE_SOURCE_POLICY: ${{ inputs.ki_core_source_policy }}
          KI_CORE_CANDIDATE_RUN_ID: ${{ inputs.ki_core_candidate_run_id }}
          KI_CORE_CANDIDATE_HEAD_SHA: ${{ inputs.ki_core_candidate_head_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/product/main'
          [[ "$DISTRIBUTION_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ "$PROJECT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p "require('./source/distribution-manifest.json').distributionId")" = "$DISTRIBUTION_ID"
          test "$(node -p "require('./source/distribution-manifest.json').version")" = "$PROJECT_VERSION"
          platforms_json="$(node -p "JSON.stringify(require('./source/distribution-manifest.json').platforms.formal)")"

          SOURCE_BRANCH="distribution/$DISTRIBUTION_ID"
          node trusted/packages/shared-scripts/src/projectDistribution.js verify-source-reachability \
            --repository source \
            --source-sha "$SOURCE_SHA" \
            --source-branch "$SOURCE_BRANCH" \
            --output validated/source-reachability.json

          mkdir -p validated
          encoded_branch="${SOURCE_BRANCH//\//%2F}"
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/rules/branches/$encoded_branch?per_page=100" \
            --output validated/github-branch-rules.json
          node trusted/packages/shared-scripts/src/projectDistribution.js resolve-branch-rules \
            --rules validated/github-branch-rules.json \
            --output validated/branch-ruleset-evidence.json

          registration_revision="$(git -C trusted rev-parse HEAD)"
          common_args=(
            --registry trusted/distributions/registry.json
            --manifest source/distribution-manifest.json
            --delivery-records trusted/distributions/delivery-records.json
            --product-config trusted/ki-buddy-product.json
            --mode formal
            --platforms-json "$platforms_json"
            --source-sha "$SOURCE_SHA"
            --source-branch "$SOURCE_BRANCH"
            --source-reachability validated/source-reachability.json
            --ruleset-evidence validated/branch-ruleset-evidence.json
            --registration-revision "$registration_revision"
            --build-credential-names '[]'
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --output "$BUILD_PLAN"
          )

          case "$KI_CORE_SOURCE_POLICY" in
            release-pinned)
              test -z "$KI_CORE_CANDIDATE_RUN_ID"
              test -z "$KI_CORE_CANDIDATE_HEAD_SHA"
              node trusted/packages/shared-scripts/src/projectDistribution.js resolve "${common_args[@]}"
              ;;
            candidate)
              [[ "$KI_CORE_CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$KI_CORE_CANDIDATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              mkdir -p validated/ki-core-candidates
              while read -r platform; do
                node trusted/packages/shared-scripts/src/projectDistribution.js resolve-ki-core-candidate \
                  --platform "$platform" \
                  --run-id "$KI_CORE_CANDIDATE_RUN_ID" \
                  --head-sha "$KI_CORE_CANDIDATE_HEAD_SHA" \
                  --output "validated/ki-core-candidates/$platform.json"
              done < <(node -e "for (const platform of JSON.parse(process.argv[1])) console.log(platform)" "$platforms_json")
              node trusted/packages/shared-scripts/src/projectDistribution.js merge-ki-core-candidates \
                --platforms-json "$platforms_json" \
                --directory validated/ki-core-candidates \
                --output validated/ki-core-candidate-provenance.json
              node trusted/packages/shared-scripts/src/projectDistribution.js resolve \
                "${common_args[@]}" \
                --ki-core-provenance validated/ki-core-candidate-provenance.json
              ;;
            *)
              echo "Unsupported Ki-Core source policy: $KI_CORE_SOURCE_POLICY" >&2
              exit 1
              ;;
          esac

          baseline="$(node -p "require('./validated/project-build-plan.json').baseline.commit")"
          git -C source merge-base --is-ancestor "$baseline" "$SOURCE_SHA"
          node trusted/packages/shared-scripts/src/projectDistribution.js create-build-matrix \
            --build-plan "$BUILD_PLAN" \
            --output validated/build-matrix.json
          printf 'registration_revision=%s\n' "$registration_revision" >> "$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$(cat validated/build-matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Upload immutable formal build plan
        uses: actions/upload-artifact@v6
        with:
          name: project-formal-plan-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: validated/

  formal_build:
    if: inputs.mode == 'formal'
    needs: formal_validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.formal_validate.outputs.matrix) }}
    env:
      KI_BUDDY_RESOLVED_BUILD_PLAN: ${{ github.workspace }}/validated/project-build-plan.json
      AIONUI_BACKEND_SOURCE_POLICY: ${{ inputs.ki_core_source_policy }}
      AIONUI_BACKEND_RUN_ID: ${{ inputs.ki_core_candidate_run_id }}
      AIONUI_BACKEND_EXPECTED_SHA: ${{ inputs.ki_core_candidate_head_sha }}
    steps:
      - name: Checkout trusted project build setup
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.formal_validate.outputs.registration_revision }}
          path: trusted
          persist-credentials: false

      - name: Checkout requested project source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Download immutable formal build plan
        uses: actions/download-artifact@v7
        with:
          name: project-formal-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: validated

      - name: Prepare project build dependencies
        uses: ./trusted/.github/actions/setup-project-build
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          source-directory: ${{ github.workspace }}/source

      - name: Build formal package
        working-directory: source
        run: ${{ matrix.command }}

      - name: Upload unverified formal installer
        uses: actions/upload-artifact@v6
        with:
          name: project-formal-installer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
          path: |
            source/out/*.dmg
            source/out/*.exe
            source/out/*.deb

      - name: Upload unverified formal evidence
        uses: actions/upload-artifact@v6
        with:
          name: project-formal-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
          path: source/out/project-distribution/project-build-evidence.json

  formal_verify:
    if: inputs.mode == 'formal'
    needs: [formal_validate, formal_build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.formal_validate.outputs.matrix) }}
    steps:
      - name: Checkout exact trusted registration revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.formal_validate.outputs.registration_revision }}
          path: trusted
          persist-credentials: false

      - name: Checkout requested project source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download immutable formal build plan
        uses: actions/download-artifact@v7
        with:
          name: project-formal-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: validated

      - name: Download unverified formal installer
        uses: actions/download-artifact@v7
        with:
          name: project-formal-installer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: candidate

      - name: Download unverified formal evidence
        uses: actions/download-artifact@v7
        with:
          name: project-formal-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: candidate

      - name: Verify formal platform artifact
        run: >-
          node trusted/packages/shared-scripts/src/projectDistribution.js verify-artifact
          --project-root source
          --artifacts-root candidate
          --platform ${{ matrix.platform }}
          --build-plan validated/project-build-plan.json
          --output-directory verified/${{ matrix.platform }}

      - name: Upload verified formal platform
        uses: actions/upload-artifact@v6
        with:
          name: project-formal-verified-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
          path: verified/${{ matrix.platform }}/

  formal_finalize:
    if: inputs.mode == 'formal'
    needs: [formal_validate, formal_verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trusted registration revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.formal_validate.outputs.registration_revision }}
          path: trusted
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download immutable formal build plan
        uses: actions/download-artifact@v7
        with:
          name: project-formal-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: validated

      - name: Download every verified formal platform
        uses: actions/download-artifact@v7
        with:
          pattern: project-formal-verified-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: verified-platforms

      - name: Create atomic formal candidate
        run: >-
          node trusted/packages/shared-scripts/src/projectDistribution.js create-candidate
          --build-plan validated/project-build-plan.json
          --verifications verified-platforms
          --output verified/project-candidate.json

      - name: Upload formal candidate attempt
        uses: actions/upload-artifact@v6
        with:
          name: ki-buddy-${{ inputs.distribution_id }}-${{ inputs.version }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            verified-platforms/**/installers/*
            verified-platforms/**/project-build-evidence.json
            verified-platforms/**/project-platform-verification.json
            validated/project-build-plan.json
            verified/project-candidate.json
